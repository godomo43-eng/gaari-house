<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인제 가아리 집 안내</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f7f4ef;color:#231d18}.w{max-width:1120px;margin:auto;padding:16px}header{position:sticky;top:0;z-index:5;background:#fffdf9e8;border-bottom:1px solid #e8dfd4}nav{height:62px;display:flex;align-items:center;justify-content:space-between}nav b{font-size:20px}nav a{margin-left:14px;color:#6d655d;text-decoration:none;font-size:14px}.heroimg{width:100%;height:420px;object-fit:cover;border-radius:24px}.top{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:#fffdf9;border:1px solid #e8dfd4;border-radius:22px;padding:22px}h1{font-size:38px;margin:0 0 18px}h2{font-size:30px;margin:10px 0 18px}h3{font-size:22px;margin:0 0 8px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick div{background:#f4eee6;border-radius:14px;padding:14px}.map{width:100%;height:250px;border:0;border-radius:18px}.space{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start;margin:22px 0}.plan{position:sticky;top:84px}.plan img,.photos img{width:100%;border-radius:18px;display:block}.photos{display:grid;gap:14px}.photo{background:#fffdf9;border:1px solid #e8dfd4;border-radius:20px;padding:10px}.photo b{display:block;padding:8px 4px 2px}.calhead{display:flex;justify-content:space-between;align-items:center}.calhead button,.form button{border:0;border-radius:12px;padding:10px 14px;background:#332a24;color:white}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;padding:8px;font-size:13px}.day{min-height:92px;background:#fff;border:1px solid #eee2d6;border-radius:10px;padding:7px;font-size:13px}.event{margin-top:4px;padding:4px 6px;background:#eee5d9;border-radius:6px;font-size:11px}.form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-top:14px}.form input{padding:10px;border:1px solid #d9cec2;border-radius:10px}@media(max-width:720px){nav a{display:none}.heroimg{height:250px;border-radius:16px}.top,.space{grid-template-columns:1fr}.plan{position:static}.card{padding:15px;border-radius:16px}h1{font-size:29px}.quick{grid-template-columns:1fr}.space{gap:10px}.photos{grid-template-columns:1fr 1fr}.photo{padding:6px}.photo b{font-size:13px}.day{min-height:66px;padding:4px;font-size:11px}.form{grid-template-columns:1fr}.w{padding:10px}}</style></head><body><header><div class="w"><nav><b>인제 가아리 집</b><div><a href="#space">공간</a><a href="#calendar">방문 일정</a></div></nav></div></header><main class="w"><img class="heroimg" src="assets/hero.jpg" alt="가아리 집 전경"><section class="top"><div class="card"><h1>인제 가아리 집</h1><div class="quick"><div><b>주소</b><br>강원특별자치도 인제군 광치령로 199-22</div><div><b>예상 소요시간</b><br>용인 수지 기준 약 2시간 10분</div></div></div><div class="card"><iframe class="map" loading="lazy" src="https://maps.google.com/maps?q=%EA%B0%95%EC%9B%90%ED%8A%B9%EB%B3%84%EC%9E%90%EC%B9%98%EB%8F%84%20%EC%9D%B8%EC%A0%9C%EA%B5%B0%20%EA%B4%91%EC%B9%98%EB%A0%B9%EB%A1%9C%20199-22&z=15&output=embed"></iframe></div></section><section id="space"><h2>공간</h2><div class="space"><div class="card plan"><img src="assets/floorplan.jpg" alt="평면도"></div><div class="photos"><div class="photo"><img src="assets/hall1.jpg"><b>대형 홀</b></div><div class="photo"><img src="assets/hall2.jpg"><b>대형 홀</b></div><div class="photo"><img src="assets/appliance.jpg"><b>주방 설비</b></div><div class="photo"><img src="assets/kitchen.jpg"><b>큰 주방</b></div><div class="photo"><img src="assets/living.jpg"><b>거실</b></div><div class="photo"><img src="assets/bedroom.jpg"><b>침실</b></div><div class="photo"><img src="assets/stairs.jpg"><b>다락 계단</b></div><div class="photo"><img src="assets/attic.jpg"><b>다락</b></div></div></div></section><section id="calendar" class="card"><div class="calhead"><button onclick="move(-1)">‹</button><h2 id="month"></h2><button onclick="move(1)">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="days" class="days"></div><div class="form"><input id="date" type="date"><input id="name" placeholder="방문자"><input id="memo" placeholder="메모"><button onclick="addVisit()">일정 등록</button></div></section></main><script>const U='https://qdldjwxsybijzrygkwbg.supabase.co/rest/v1/gaari_visits';const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkbGRqd3hzeWJpanpyeWdxd2JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU0ODIyMjQsImV4cCI6MjA3MTA1ODIyNH0.placeholder';let now=new Date(),visits=[];async function load(){try{let r=await fetch(U+'?select=*&order=visit_date.asc',{headers:{apikey:K,Authorization:'Bearer '+K}});if(r.ok)visits=await r.json()}catch(e){}render()}function render(){let y=now.getFullYear(),m=now.getMonth();document.getElementById('month').textContent=y+'년 '+(m+1)+'월';let first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),out='';for(let i=0;i<first;i++)out+='<div></div>';for(let d=1;d<=last;d++){let ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ev=visits.filter(v=>v.visit_date===ds);out+='<div class="day"><b>'+d+'</b>'+ev.map(v=>'<div class="event">'+(v.visitor_name||v.name||'방문')+(v.memo?' · '+v.memo:'')+'</div>').join('')+'</div>'}document.getElementById('days').innerHTML=out}function move(n){now=new Date(now.getFullYear(),now.getMonth()+n,1);render()}async function addVisit(){let date=document.getElementById('date').value,name=document.getElementById('name').value.trim(),memo=document.getElementById('memo').value.trim();if(!date||!name)return alert('날짜와 방문자를 입력해주세요.');let body={visit_date:date,visitor_name:name,memo:memo};let r=await fetch(U,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});if(r.ok){document.getElementById('name').value='';document.getElementById('memo').value='';load()}else alert('일정 등록에 실패했습니다.')}load();setInterval(load,15000);</script></body></html>
