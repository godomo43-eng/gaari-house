</style></head><body><header><div class="wrap"><nav><b>인제 가아리</b><div><a href="#space">공간 소개</a><a href="#calendar">방문 일정</a></div></nav></div></header><main class="wrap"><img class="hero" src="hero.jpg"><section class="topgrid"><div class="card"><h1>인제 가아리</h1><div class="quick"><div><small>주소</small><b>강원특별자치도 인제군 광치령로 199-22</b></div><div><small>예상 소요시간</small><b>동홍천 IC 약 35분<br>가평휴게소 약 1시간<br>하남 IC 약 1시간 30분</b></div></div></div><div class="card"><iframe class="map" src="https://maps.google.com/maps?q=%EA%B0%95%EC%9B%90%ED%8A%B9%EB%B3%84%EC%9E%90%EC%B9%98%EB%8F%84%20%EC%9D%B8%EC%A0%9C%EA%B5%B0%20%EA%B4%91%EC%B9%98%EB%A0%B9%EB%A1%9C%20199-22&z=15&output=embed"></iframe></div></section><section id="space"><h2>공간 소개</h2><div class="spacegrid"><div class="card plan"><img src="floorplan.jpg"></div><div class="photos"><div class="photo"><img src="hall1.jpg"><div class="cap"><b>대형 홀</b></div></div><div class="photo"><img src="kitchen.jpg"><div class="cap"><b>큰 주방</b></div></div><div class="photo"><img src="living.jpg"><div class="cap"><b>거실</b></div></div><div class="photo"><img src="bedroom.jpg"><div class="cap"><b>침실</b></div></div><div class="photo"><img src="attic.jpg"><div class="cap"><b>다락</b></div></div></div></div></section><section id="calendar" class="card calendar-card"><div class="calbar"><button class="navbtn" id="prev">‹</button><h2 id="monthTitle">방문 일정</h2><button class="navbtn" id="next">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="days" class="days"></div><div class="form"><input id="startDate" type="date"><input id="endDate" type="date"><input id="visitor" placeholder="방문자"><input id="people" type="number" min="1" max="30" placeholder="인원"><input id="note" class="wide" placeholder="메모"><button class="primary" id="addBtn">일정 등록</button></div><div id="status" class="status">공용 달력에 연결 중…</div><div class="legendline">빨간 날짜는 대한민국 공휴일, 파란 날짜는 토요일입니다.</div></section></main><div id="modal" class="modal"><div class="modalbox"><h3 id="mTitle"></h3><p id="mBody"></p><div class="actions"><button class="ghost" id="closeModal">닫기</button><button class="primary" id="deleteBtn">일정 삭제</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SB_URL='https://qdldjwxsybijzrygkwbg.supabase.co',SB_KEY='sb_publishable_UsXzXwBUzFc8aAjSpuQs6A_p0Kv6khz',sb=supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`,fmt=d=>dateKey(d.getFullYear(),d.getMonth(),d.getDate());
const HOLIDAYS={'2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴','2026-03-01':'3·1절','2026-03-02':'대체공휴일','2026-05-05':'어린이날','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-03':'전국동시지방선거','2026-06-06':'현충일','2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날','2026-12-25':'성탄절'};let cursor=new Date();cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1,12);let visits=[],selectedId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadVisits(){const {data,error}=await sb.from('gaari_visits').select('*').order('start_date');if(error){$('status').textContent='달력 연결 오류: '+error.message;return}visits=data||[];$('status').textContent='실시간 공용 달력 연결됨';render()}
function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1,12),start=new Date(y,m,1-first.getDay(),12);$('monthTitle').textContent=`${y}년 ${m+1}월 방문 일정`;let out='';for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i,12),ds=fmt(d),holiday=HOLIDAYS[ds]||'',dow=d.getDay(),ev=visits.filter(v=>ds>=v.start_date&&ds<=v.end_date);out+=`<div class="day ${d.getMonth()!==m?'other':''} ${holiday?'holiday':''} ${dow===0?'sunday':''} ${dow===6?'saturday':''}"><div class="daynum">${d.getDate()}</div>${holiday?`<div class="holiday-name">${esc(holiday)}</div>`:''}${ev.map(v=>`<div class="event" data-id="${v.id}"><strong>${esc(v.visitor_name)}</strong> ${v.people||''}${v.people?'명':''}</div>`).join('')}</div>`}$('days').innerHTML=out;document.querySelectorAll('.event').forEach(e=>e.onclick=()=>showVisit(e.dataset.id))}
function showVisit(id){const v=visits.find(x=>x.id===id);if(!v)return;selectedId=id;$('mTitle').textContent=v.visitor_name;$('mBody').innerHTML=`기간: <b>${v.start_date} ~ ${v.end_date}</b><br>인원: ${v.people||'-'}명<br>메모: ${esc(v.note||'-')}`;$('modal').classList.add('on')}
async function addVisit(){const start=$('startDate').value,end=$('endDate').value||start,visitor=$('visitor').value.trim(),people=$('people').value?Number($('people').value):null,note=$('note').value.trim()||null;if(!start||!visitor)return alert('시작일과 방문자를 입력해주세요.');if(end<start)return alert('종료일은 시작일보다 빠를 수 없습니다.');const {error}=await sb.from('gaari_visits').insert({visitor_name:visitor,start_date:start,end_date:end,people,note});if(error)return alert(error.code==='23P01'?'이미 등록된 방문 일정과 기간이 겹칩니다.':'등록 실패: '+error.message);await loadVisits()}
async function deleteVisit(){if(!selectedId||!confirm('이 일정을 삭제할까요?'))return;const {error}=await sb.from('gaari_visits').delete().eq('id',selectedId);if(error)return alert(error.message);$('modal').classList.remove('on');await loadVisits()}
$('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1,12);render()};$('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1,12);render()};$('addBtn').onclick=addVisit;$('closeModal').onclick=()=>$('modal').classList.remove('on');$('deleteBtn').onclick=deleteVisit;const now=new Date(),today=dateKey(now.getFullYear(),now.getMonth(),now.getDate());$('startDate').value=$('endDate').value=today;loadVisits();sb.channel('gaari-live').on('postgres_changes',{event:'*',schema:'public',table:'gaari_visits'},loadVisits).subscribe();
</script></body></html>
