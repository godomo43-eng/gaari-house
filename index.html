<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인제 가아리 집 안내</title>
<style>
:root{--bg:#f6f2ec;--card:#fffdfa;--ink:#211b17;--muted:#746a62;--line:#e6ddd3;--accent:#5a4434;--soft:#efe7de}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:auto;padding:0 18px}header{position:sticky;top:0;z-index:20;background:rgba(255,253,250,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{height:64px;display:flex;align-items:center;justify-content:space-between}nav b{font-size:20px}nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:18px}
main{padding:20px 0 48px}.hero{width:100%;height:min(56vw,520px);min-height:290px;object-fit:cover;border-radius:26px}
.topgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(65,47,34,.05)}
h1{font-size:38px;line-height:1.18;margin:0 0 18px}h2{font-size:29px;margin:34px 0 18px}h3{font-size:21px;margin:0 0 8px}p{color:var(--muted);line-height:1.75}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick>div{background:var(--soft);border-radius:15px;padding:15px;line-height:1.65}.quick small{display:block;color:var(--muted);margin-bottom:4px}
.map{width:100%;height:265px;border:0;border-radius:17px}
.spacegrid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:20px;align-items:start}.plan{position:sticky;top:84px;padding:12px}.plan img{width:100%;border-radius:16px}
.photos{display:grid;gap:15px}.photo{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.photo img{width:100%;max-height:460px;object-fit:cover}.photo .cap{padding:13px 15px 15px}.photo .cap b{font-size:17px}.photo .cap span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.calendar-card{margin-top:36px}.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.calbar h2{margin:0}button{font:inherit;cursor:pointer}.navbtn,.primary,.ghost{border:0;border-radius:12px;padding:10px 14px}.navbtn,.primary{background:var(--accent);color:white}.ghost{background:var(--soft);color:var(--ink)}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week{margin-top:18px}.week div{text-align:center;color:var(--muted);font-size:13px;padding:7px}.day{min-height:104px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;overflow:hidden}.day.other{opacity:.35}.daynum{font-weight:700;font-size:13px}.event{margin-top:5px;padding:5px 6px;border-radius:7px;background:var(--soft);font-size:11px;line-height:1.35;cursor:pointer}.event strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{display:grid;grid-template-columns:1.1fr 1.1fr 1.1fr .65fr 1.3fr auto;gap:8px;margin-top:16px}input{width:100%;padding:11px 10px;border:1px solid #d7ccc0;border-radius:10px;background:white;font:inherit;font-size:14px}.status{margin-top:10px;color:var(--muted);font-size:13px}.legendline{margin-top:10px;color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(20,15,12,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.on{display:flex}.modalbox{width:min(460px,100%);background:white;border-radius:20px;padding:20px}.modalbox .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:800px){.wrap{padding:0 12px}nav a{display:none}main{padding-top:12px}.hero{height:260px;min-height:0;border-radius:18px}.topgrid,.spacegrid{grid-template-columns:1fr}.plan{position:static}.card{padding:16px;border-radius:17px}h1{font-size:30px}h2{font-size:25px;margin-top:28px}.quick{grid-template-columns:1fr}.week,.days{gap:3px}.day{min-height:72px;padding:4px;border-radius:8px}.event{font-size:10px;padding:3px}.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}.primary{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="wrap"><nav><b>인제 가아리 집</b><div><a href="#space">공간 소개</a><a href="#calendar">방문 일정</a></div></nav></div></header>
<main class="wrap">
<img class="hero" src="https://raw.githubusercontent.com/godomo43-eng/gaari-house/main/hero.jpg" alt="가아리 집 전경">
<section class="topgrid">
  <div class="card"><h1>인제 가아리 집</h1><div class="quick"><div><small>주소</small><b>강원특별자치도 인제군 광치령로 199-22</b></div><div><small>예상 소요시간</small><b>동홍천 IC 약 35분<br>가평휴게소 약 1시간<br>하남 IC 약 1시간 30분</b></div></div></div>
  <div class="card"><iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=%EA%B0%95%EC%9B%90%ED%8A%B9%EB%B3%84%EC%9E%90%EC%B9%98%EB%8F%84%20%EC%9D%B8%EC%A0%9C%EA%B5%B0%20%EA%B4%91%EC%B9%98%EB%A0%B9%EB%A1%9C%20199-22&z=15&output=embed"></iframe></div>
</section>
<section id="space"><h2>공간 소개</h2><div class="spacegrid"><div class="card plan"><img src="https://raw.githubusercontent.com/godomo43-eng/gaari-house/main/floorplan.jpg" alt="가아리 집 평면도"></div><div class="photos"><div class="photo"><img src="https://raw.githubusercontent.com/godomo43-eng/gaari-house/main/hall1.jpg" alt="대형 홀"><div class="cap"><b>대형 홀</b><span>집의 중심이 되는 넓은 공용 공간</span></div></div><div class="photo"><img src="https://raw.githubusercontent.com/godomo43-eng/gaari-house/main/kitchen.jpg" alt="큰 주방"><div class="cap"><b>큰 주방</b><span>여럿이 함께 사용하기 좋은 주방 공간</span></div></div><div class="photo"><img src="https://raw.githubusercontent.com/godomo43-eng/gaari-house/main/living.jpg" alt="거실"><div class="cap"><b>거실</b></div></div><div class="photo"><img src="https://raw.githubusercontent.com/godomo43-eng/gaari-house/main/bedroom.jpg" alt="침실"><div class="cap"><b>침실</b></div></div><div class="photo"><img src="https://raw.githubusercontent.com/godomo43-eng/gaari-house/main/attic.jpg" alt="다락"><div class="cap"><b>다락</b><span>계단을 통해 연결되는 상부 공간</span></div></div></div></div></section>
<section id="calendar" class="card calendar-card"><div class="calbar"><button class="navbtn" id="prev">‹</button><h2 id="monthTitle">방문 일정</h2><button class="navbtn" id="next">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="days" class="days"></div><div class="form"><input id="startDate" type="date"><input id="endDate" type="date"><input id="visitor" placeholder="방문자"><input id="people" type="number" min="1" max="30" placeholder="인원"><input id="note" class="wide" placeholder="메모"><button class="primary" id="addBtn">일정 등록</button></div><div id="status" class="status">공용 달력에 연결 중…</div><div class="legendline">일정을 누르면 상세 내용을 확인하고 삭제할 수 있습니다. 일정 기간이 겹치면 등록되지 않습니다.</div></section>
</main>
<div id="modal" class="modal"><div class="modalbox"><h3 id="mTitle"></h3><p id="mBody"></p><div class="actions"><button class="ghost" id="closeModal">닫기</button><button class="primary" id="deleteBtn">일정 삭제</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://qdldjwxsybijzrygkwbg.supabase.co';
const SB_KEY='sb_publishable_UsXzXwBUzFc8aAjSpuQs6A_p0Kv6khz';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');
const dateKey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const fmtLocal=d=>dateKey(d.getFullYear(),d.getMonth(),d.getDate());
let cursor=new Date();cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1,12,0,0,0);let visits=[];let selectedId=null;
function inRange(ds,a,b){return ds>=a&&ds<=b}
async function loadVisits(){ $('status').textContent='일정을 불러오는 중…';const {data,error}=await sb.from('gaari_visits').select('*').order('start_date');if(error){$('status').textContent='달력 연결 오류: '+error.message;return}visits=data||[];$('status').textContent='실시간 공용 달력 연결됨';render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const y=cursor.getFullYear(),m=cursor.getMonth();$('monthTitle').textContent=`${y}년 ${m+1}월 방문 일정`;const first=new Date(y,m,1,12);const gridStart=new Date(y,m,1-first.getDay(),12);let out='';for(let i=0;i<42;i++){const d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i,12);const ds=fmtLocal(d),other=d.getMonth()!==m;const ev=visits.filter(v=>inRange(ds,v.start_date,v.end_date));out+=`<div class="day ${other?'other':''}"><div class="daynum">${d.getDate()}</div>${ev.map(v=>`<div class="event" data-id="${v.id}"><strong>${esc(v.visitor_name)}</strong>${v.people?esc(String(v.people))+'명':''}</div>`).join('')}</div>`}$('days').innerHTML=out;document.querySelectorAll('.event').forEach(el=>el.onclick=()=>showVisit(el.dataset.id))}
function showVisit(id){const v=visits.find(x=>x.id===id);if(!v)return;selectedId=id;$('mTitle').textContent=v.visitor_name;$('mBody').innerHTML=`기간: <b>${v.start_date} ~ ${v.end_date}</b><br>인원: ${v.people||'-'}명<br>메모: ${esc(v.note||'-')}`;$('modal').classList.add('on')}
async function addVisit(){const start=$('startDate').value,end=$('endDate').value||start,visitor=$('visitor').value.trim(),people=$('people').value?Number($('people').value):null,note=$('note').value.trim()||null;if(!start||!visitor)return alert('시작일과 방문자를 입력해주세요.');if(end<start)return alert('종료일은 시작일보다 빠를 수 없습니다.');$('addBtn').disabled=true;const {error}=await sb.from('gaari_visits').insert({visitor_name:visitor,start_date:start,end_date:end,people,note});$('addBtn').disabled=false;if(error){alert(error.code==='23P01'?'이미 등록된 방문 일정과 기간이 겹칩니다.':'등록 실패: '+error.message);return}$('visitor').value='';$('people').value='';$('note').value='';await loadVisits()}
async function deleteVisit(){if(!selectedId||!confirm('이 일정을 삭제할까요?'))return;const {error}=await sb.from('gaari_visits').delete().eq('id',selectedId);if(error)return alert('삭제 실패: '+error.message);$('modal').classList.remove('on');selectedId=null;await loadVisits()}
$('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1,12);render()};$('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1,12);render()};$('addBtn').onclick=addVisit;$('closeModal').onclick=()=>$('modal').classList.remove('on');$('deleteBtn').onclick=deleteVisit;$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};const now=new Date();const today=dateKey(now.getFullYear(),now.getMonth(),now.getDate());$('startDate').value=today;$('endDate').value=today;loadVisits();sb.channel('gaari-visits-live').on('postgres_changes',{event:'*',schema:'public',table:'gaari_visits'},()=>loadVisits()).subscribe();
</script>
</body></html>
